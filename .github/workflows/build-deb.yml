name: Build DEB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o VirtualContacts-Theos.zip
      - run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid xz
      - run: git clone --recursive https://github.com/theos/theos.git ~/theos
      - run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/*.sdk ~/theos/sdks/
      - run: |
          export THEOS=~/theos
          cd VirtualContacts
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualContacts-DEB
          path: VirtualContacts/packages/*.deb
