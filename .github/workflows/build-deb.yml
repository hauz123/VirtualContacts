
name: Build DEB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o VirtualContacts-Theos.zip
      - run: brew install ldid xz dpkg
      - run: git clone --recursive https://github.com/theos/theos.git ~/theos
      - run: |
          export THEOS=~/theos
          cd VirtualContacts
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualContacts-DEB
          path: VirtualContacts/packages/*.deb
